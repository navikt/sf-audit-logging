apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: sf-audit-logging
  namespace: teamcrm
  labels:
    team: teamcrm
spec:
  image: "{{ image }}"
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/isAlive
  readiness:
    path: /internal/isReady
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    logging:
      destinations:
        - id: loki
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 10m
      memory: 32Mi
  ingresses:
    - "https://sf-audit-logging.intern.nav.no"
  accessPolicy:
    outbound:
      external:
        - host: navdialog.my.salesforce.com
  env:
    - name: SALESFORCE_API_VERSION
      value: "v62.0"
    - name: SF_TOKENHOST
      value: "https://login.salesforce.com/services/oauth2/token"
  envFrom:
    - secret: sf-audit-logging
